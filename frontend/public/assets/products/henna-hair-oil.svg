<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFF8EE"/>
      <stop offset="100%" stop-color="#F5E6CC"/>
    </radialGradient>
    <linearGradient id="btl1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C49040"/>
      <stop offset="50%" stop-color="#F5D080"/>
      <stop offset="100%" stop-color="#C49040"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg1)"/>
  <!-- Leaf decorations -->
  <ellipse cx="55" cy="70" rx="28" ry="16" fill="#8B6914" opacity="0.18" transform="rotate(-20 55 70)"/>
  <ellipse cx="345" cy="330" rx="28" ry="16" fill="#8B6914" opacity="0.18" transform="rotate(-20 345 330)"/>
  <!-- Bottle neck -->
  <rect x="178" y="105" width="44" height="62" rx="6" fill="url(#btl1)" stroke="#A07020" stroke-width="1.5"/>
  <!-- Cap -->
  <rect x="172" y="90" width="56" height="22" rx="7" fill="#7A5510"/>
  <rect x="180" y="83" width="40" height="12" rx="4" fill="#5A3D08"/>
  <!-- Bottle body -->
  <path d="M148,167 Q140,185 138,210 L138,318 Q138,338 158,338 L242,338 Q262,338 262,318 L262,210 Q260,185 252,167 Z" fill="url(#btl1)" stroke="#A07020" stroke-width="2"/>
  <!-- Liquid -->
  <path d="M150,228 L150,318 Q150,330 158,330 L242,330 Q250,330 250,318 L250,228 Z" fill="#D4A030" opacity="0.45"/>
  <!-- Label -->
  <rect x="155" y="180" width="90" height="100" rx="8" fill="white" opacity="0.88"/>
  <rect x="155" y="180" width="90" height="22" rx="8" fill="#8B6914"/>
  <text x="200" y="196" font-family="Arial,sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">HAIR OIL</text>
  <text x="200" y="220" font-family="Georgia,serif" font-size="12" fill="#5A3D08" text-anchor="middle" font-weight="bold">HENNA</text>
  <text x="200" y="236" font-family="Georgia,serif" font-size="12" fill="#5A3D08" text-anchor="middle" font-weight="bold">HAIR OIL</text>
  <line x1="167" y1="244" x2="233" y2="244" stroke="#A07020" stroke-width="1" opacity="0.4"/>
  <text x="200" y="258" font-family="Arial,sans-serif" font-size="7.5" fill="#7A5510" text-anchor="middle">NATURAL COLOR</text>
  <text x="200" y="270" font-family="Arial,sans-serif" font-size="7.5" fill="#7A5510" text-anchor="middle">STRENGTHENING</text>
  <!-- Henna leaf top -->
  <circle cx="200" cy="66" r="26" fill="#D4A855" opacity="0.18"/>
  <ellipse cx="200" cy="56" rx="10" ry="18" fill="#A07A18" opacity="0.55"/>
  <line x1="200" y1="50" x2="200" y2="80" stroke="#7A5510" stroke-width="1.5" opacity="0.65"/>
  <!-- Brand -->
  <text x="200" y="374" font-family="Georgia,serif" font-size="12" fill="#5A3D08" text-anchor="middle" opacity="0.7">Sri Velva Naturals</text>
</svg>
