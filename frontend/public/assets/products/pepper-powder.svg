<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F5F5F0"/>
      <stop offset="100%" stop-color="#E2E0D8"/>
    </radialGradient>
    <radialGradient id="jarGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F0EFEA"/>
      <stop offset="100%" stop-color="#D8D6CE"/>
    </radialGradient>
    <radialGradient id="powderGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4B4538"/>
      <stop offset="60%" stop-color="#2D2720"/>
      <stop offset="100%" stop-color="#1A1510"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <circle cx="150" cy="150" r="148" fill="url(#bgGrad)" stroke="#6B7280" stroke-width="2"/>

  <!-- Scattered peppercorn dots background -->
  <circle cx="45" cy="65" r="5" fill="#2D2720" opacity="0.5"/>
  <circle cx="255" cy="85" r="4" fill="#1A1510" opacity="0.5"/>
  <circle cx="60" cy="225" r="6" fill="#2D2720" opacity="0.4"/>
  <circle cx="240" cy="235" r="4" fill="#2D2720" opacity="0.4"/>
  <circle cx="75" cy="45" r="3" fill="#4B4538" opacity="0.4"/>
  <circle cx="225" cy="55" r="5" fill="#1A1510" opacity="0.4"/>
  <circle cx="35" cy="165" r="4" fill="#2D2720" opacity="0.3"/>
  <circle cx="265" cy="170" r="3" fill="#4B4538" opacity="0.3"/>

  <!-- Peppercorn cluster top-right -->
  <g transform="translate(205, 60)">
    <circle cx="0" cy="0" r="8" fill="#2D2720"/>
    <circle cx="14" cy="-4" r="7" fill="#1A1510"/>
    <circle cx="6" cy="-14" r="6" fill="#2D2720"/>
    <circle cx="-10" cy="-6" r="7" fill="#4B4538"/>
    <circle cx="0" cy="0" r="3" fill="#4B4538" opacity="0.4"/>
    <circle cx="14" cy="-4" r="2" fill="#6B6258" opacity="0.4"/>
    <circle cx="6" cy="-14" r="2" fill="#4B4538" opacity="0.4"/>
  </g>

  <!-- Spoon with powder -->
  <g transform="translate(58, 172) rotate(-25)">
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="#9CA3AF" stroke="#6B7280" stroke-width="1"/>
    <ellipse cx="0" cy="-2" rx="18" ry="10" fill="url(#powderGrad)"/>
    <rect x="20" y="-3" width="60" height="6" rx="3" fill="#9CA3AF" stroke="#6B7280" stroke-width="1"/>
  </g>

  <!-- Main jar -->
  <g transform="translate(90, 95)">
    <rect x="15" y="40" width="90" height="100" rx="10" fill="url(#jarGrad)" stroke="#9CA3AF" stroke-width="2"/>
    <rect x="25" y="25" width="70" height="22" rx="5" fill="#F0EFEA" stroke="#9CA3AF" stroke-width="1.5"/>
    <!-- Lid - dark -->
    <rect x="18" y="12" width="84" height="18" rx="6" fill="#374151" stroke="#1F2937" stroke-width="2"/>
    <rect x="35" y="8" width="50" height="8" rx="3" fill="#1F2937"/>

    <!-- Powder inside -->
    <ellipse cx="60" cy="110" rx="38" ry="10" fill="#2D2720" opacity="0.5"/>
    <rect x="22" y="100" width="76" height="38" rx="0" fill="#2D2720" opacity="0.2"/>

    <!-- Label -->
    <rect x="20" y="60" width="80" height="55" rx="5" fill="white" opacity="0.75" stroke="#9CA3AF" stroke-width="1"/>
    <rect x="30" y="70" width="60" height="5" rx="2" fill="#374151"/>
    <rect x="35" y="80" width="50" height="4" rx="2" fill="#4B5563" opacity="0.7"/>
    <rect x="30" y="90" width="60" height="4" rx="2" fill="#6B7280" opacity="0.5"/>
    <rect x="38" y="100" width="44" height="4" rx="2" fill="#9CA3AF" opacity="0.5"/>

    <ellipse cx="30" cy="80" rx="6" ry="18" fill="white" opacity="0.25" transform="rotate(-10, 30, 80)"/>
  </g>

  <!-- Powder spill -->
  <ellipse cx="150" cy="215" rx="55" ry="9" fill="#2D2720" opacity="0.35"/>
  <ellipse cx="140" cy="218" rx="28" ry="6" fill="#1A1510" opacity="0.3"/>

  <!-- Vine/pepper plant decoration bottom-left -->
  <g transform="translate(48, 200)">
    <path d="M0,0 Q10,-20 20,-10 Q30,-30 40,-15" stroke="#4D7C0F" stroke-width="2" fill="none" opacity="0.6"/>
    <circle cx="20" cy="-10" r="5" fill="#1A1510" opacity="0.7"/>
    <circle cx="40" cy="-15" r="4" fill="#2D2720" opacity="0.7"/>
  </g>

  <text x="150" y="256" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">Pepper Powder</text>
  <text x="150" y="274" font-family="Georgia, serif" font-size="11" fill="#374151" text-anchor="middle">Western Ghats • Bold &amp; Pure</text>
</svg>
