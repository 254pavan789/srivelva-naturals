<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F3E5F5"/>
      <stop offset="100%" stop-color="#E1BEE7"/>
    </radialGradient>
    <radialGradient id="jarGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F9F0FA"/>
      <stop offset="100%" stop-color="#E1BEE7"/>
    </radialGradient>
    <radialGradient id="powderGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="60%" stop-color="#6B3410"/>
      <stop offset="100%" stop-color="#4A2308"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <circle cx="150" cy="150" r="148" fill="url(#bgGrad)" stroke="#7B1FA2" stroke-width="2"/>

  <!-- Cardamom pods scattered -->
  <g transform="translate(42, 62) rotate(20)">
    <ellipse cx="0" cy="0" rx="5" ry="10" fill="#66BB6A" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="2" ry="8" fill="#4CAF50" opacity="0.4"/>
  </g>
  <g transform="translate(255, 72) rotate(-30)">
    <ellipse cx="0" cy="0" rx="5" ry="10" fill="#66BB6A" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="2" ry="8" fill="#4CAF50" opacity="0.4"/>
  </g>

  <!-- Cinnamon stick top-right -->
  <g transform="translate(210, 52) rotate(35)">
    <rect x="-5" y="-22" width="10" height="44" rx="4" fill="#8D6E63" opacity="0.7"/>
    <rect x="-3" y="-18" width="6" height="36" rx="2" fill="#A1887F" opacity="0.5"/>
    <line x1="-4" y1="-15" x2="4" y2="-15" stroke="#6D4C41" stroke-width="1" opacity="0.6"/>
    <line x1="-4" y1="-8" x2="4" y2="-8" stroke="#6D4C41" stroke-width="1" opacity="0.6"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#6D4C41" stroke-width="1" opacity="0.6"/>
    <line x1="-4" y1="8" x2="4" y2="8" stroke="#6D4C41" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Cloves scattered -->
  <g transform="translate(58, 220)">
    <ellipse cx="0" cy="0" rx="2" ry="6" fill="#4A2308" opacity="0.6"/>
    <circle cx="0" cy="-7" r="3" fill="#3E1F00" opacity="0.6"/>
  </g>
  <g transform="translate(240, 215) rotate(20)">
    <ellipse cx="0" cy="0" rx="2" ry="6" fill="#4A2308" opacity="0.5"/>
    <circle cx="0" cy="-7" r="3" fill="#3E1F00" opacity="0.5"/>
  </g>
  <g transform="translate(75, 48) rotate(-15)">
    <ellipse cx="0" cy="0" rx="2" ry="5" fill="#4A2308" opacity="0.5"/>
    <circle cx="0" cy="-6" r="2.5" fill="#3E1F00" opacity="0.5"/>
  </g>

  <!-- Star anise decoration bottom-left -->
  <g transform="translate(60, 198) rotate(10)">
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#8B4513" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#8B4513" stroke-width="2" opacity="0.6"/>
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#8B4513" stroke-width="2" opacity="0.6"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#8B4513" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="4" fill="#A0522D" opacity="0.7"/>
    <circle cx="14" cy="0" r="3" fill="#8B4513" opacity="0.5"/>
    <circle cx="-14" cy="0" r="3" fill="#8B4513" opacity="0.5"/>
    <circle cx="0" cy="14" r="3" fill="#8B4513" opacity="0.5"/>
    <circle cx="0" cy="-14" r="3" fill="#8B4513" opacity="0.5"/>
    <circle cx="10" cy="10" r="2.5" fill="#8B4513" opacity="0.5"/>
    <circle cx="-10" cy="-10" r="2.5" fill="#8B4513" opacity="0.5"/>
    <circle cx="10" cy="-10" r="2.5" fill="#8B4513" opacity="0.5"/>
    <circle cx="-10" cy="10" r="2.5" fill="#8B4513" opacity="0.5"/>
  </g>

  <!-- Spoon -->
  <g transform="translate(58, 172) rotate(-25)">
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="#CE93D8" stroke="#9C27B0" stroke-width="1"/>
    <ellipse cx="0" cy="-2" rx="18" ry="10" fill="url(#powderGrad)"/>
    <rect x="20" y="-3" width="60" height="6" rx="3" fill="#CE93D8" stroke="#9C27B0" stroke-width="1"/>
  </g>

  <!-- Main jar -->
  <g transform="translate(90, 95)">
    <rect x="15" y="40" width="90" height="100" rx="10" fill="url(#jarGrad)" stroke="#AB47BC" stroke-width="2"/>
    <rect x="25" y="25" width="70" height="22" rx="5" fill="#F9F0FA" stroke="#AB47BC" stroke-width="1.5"/>
    <!-- Lid - deep purple -->
    <rect x="18" y="12" width="84" height="18" rx="6" fill="#6A1B9A" stroke="#4A148C" stroke-width="2"/>
    <rect x="35" y="8" width="50" height="8" rx="3" fill="#4A148C"/>

    <!-- Powder inside -->
    <ellipse cx="60" cy="110" rx="38" ry="10" fill="#8B4513" opacity="0.5"/>
    <rect x="22" y="100" width="76" height="38" rx="0" fill="#8B4513" opacity="0.22"/>

    <!-- Label -->
    <rect x="20" y="60" width="80" height="55" rx="5" fill="white" opacity="0.75" stroke="#AB47BC" stroke-width="1"/>
    <rect x="30" y="70" width="60" height="5" rx="2" fill="#6A1B9A"/>
    <rect x="35" y="80" width="50" height="4" rx="2" fill="#7B1FA2" opacity="0.7"/>
    <rect x="30" y="90" width="60" height="4" rx="2" fill="#8E24AA" opacity="0.5"/>
    <rect x="38" y="100" width="44" height="4" rx="2" fill="#AB47BC" opacity="0.5"/>

    <ellipse cx="30" cy="80" rx="6" ry="18" fill="white" opacity="0.25" transform="rotate(-10, 30, 80)"/>
  </g>

  <!-- Powder spill -->
  <ellipse cx="150" cy="215" rx="55" ry="9" fill="#8B4513" opacity="0.35"/>
  <ellipse cx="140" cy="218" rx="30" ry="6" fill="#6B3410" opacity="0.3"/>

  <text x="150" y="256" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#4A148C" text-anchor="middle">Garam Masala</text>
  <text x="150" y="274" font-family="Georgia, serif" font-size="11" fill="#6A1B9A" text-anchor="middle">Hand-Blended • Whole Spices</text>
</svg>
