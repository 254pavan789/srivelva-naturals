<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FDF8F0"/>
      <stop offset="100%" stop-color="#EDE3D0"/>
    </radialGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C68B3A"/>
      <stop offset="40%" stop-color="#E8A84E"/>
      <stop offset="100%" stop-color="#B5762C"/>
    </linearGradient>
  </defs>
  <circle cx="150" cy="150" r="148" fill="url(#bg)" stroke="#D4A96A" stroke-width="2"/>
  <!-- Amber bottle body -->
  <rect x="118" y="130" width="64" height="100" rx="10" fill="url(#bottleGrad)" opacity="0.9"/>
  <!-- Bottle neck -->
  <rect x="133" y="100" width="34" height="35" rx="6" fill="url(#bottleGrad)" opacity="0.9"/>
  <!-- Bottle cap -->
  <rect x="130" y="88" width="40" height="16" rx="5" fill="#7A4F1E"/>
  <!-- Dropper tip -->
  <rect x="147" y="72" width="6" height="18" rx="3" fill="#7A4F1E"/>
  <!-- Shine -->
  <rect x="126" y="140" width="10" height="50" rx="5" fill="white" opacity="0.2"/>
  <!-- Sesame seeds scattered -->
  <ellipse cx="100" cy="200" rx="6" ry="3" fill="#C8A45E" opacity="0.7" transform="rotate(-20,100,200)"/>
  <ellipse cx="205" cy="185" rx="6" ry="3" fill="#C8A45E" opacity="0.7" transform="rotate(15,205,185)"/>
  <ellipse cx="90" cy="170" rx="5" ry="2.5" fill="#C8A45E" opacity="0.6" transform="rotate(30,90,170)"/>
  <ellipse cx="210" cy="215" rx="5" ry="2.5" fill="#C8A45E" opacity="0.6" transform="rotate(-10,210,215)"/>
  <ellipse cx="108" cy="230" rx="6" ry="3" fill="#C8A45E" opacity="0.5" transform="rotate(25,108,230)"/>
  <!-- Label -->
  <rect x="122" y="155" width="56" height="45" rx="4" fill="white" opacity="0.85"/>
  <text x="150" y="172" font-family="Georgia,serif" font-size="7" fill="#7A4F1E" text-anchor="middle" font-weight="bold">COLD PRESSED</text>
  <text x="150" y="182" font-family="Georgia,serif" font-size="7" fill="#7A4F1E" text-anchor="middle">SESAME OIL</text>
  <text x="150" y="194" font-family="Georgia,serif" font-size="6" fill="#A08040" text-anchor="middle">100% Pure</text>
  <text x="150" y="258" font-family="Georgia,serif" font-size="13" fill="#A08040" text-anchor="middle">Sri Velva Naturals</text>
</svg>
