# ── Sri Velva Naturals Backend Configuration ──────────────────────────────

# ── Database ────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/srivelva?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── JSON serialization ────────────────────────────────────────────────────────
spring.jackson.serialization.fail-on-empty-beans=false

# ── Server ───────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── CORS ─────────────────────────────────────────────────────────────────────
# NOTE: comma-separated list — CorsConfig splits this manually
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.srivelva=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.orm.connections.pooling=ERROR
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.com.zaxxer.hikari=WARN

# ── Razorpay ─────────────────────────────────────────────────────────────────
# razorpay.key removed - payments via QR/UPI
# razorpay.secret removed - payments via QR/UPI

# ── Twilio / WhatsApp ────────────────────────────────────────────────────────
twilio.account-sid=${TWILIO_ACCOUNT_SID:mock}
twilio.auth-token=${TWILIO_AUTH_TOKEN:mock}
twilio.from-number=${TWILIO_FROM_NUMBER:whatsapp:+14155238886}
twilio.admin-phone=${TWILIO_ADMIN_PHONE:whatsapp:+919944268288}

# ── Admin Authentication ──────────────────────────────────────────────────────
# Username and password for the /admin panel login page.
# Override with environment variables in production:
#   export ADMIN_USERNAME=yourUsername
#   export ADMIN_PASSWORD=yourStrongPassword
#   export ADMIN_JWT_SECRET=at-least-32-random-characters
#
# DEFAULT CREDENTIALS (development only):
#   username: admin
#   password: admin123
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}
admin.jwt-secret=${ADMIN_JWT_SECRET:srivelva-dev-secret-change-in-production-2024}

# ── File Upload ───────────────────────────────────────────────────────────────
# Max file size per upload and max request size for multipart requests.
# Increase if admins need to upload larger product images.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
spring.servlet.multipart.file-size-threshold=2KB

# ── Email / SMTP ───────────────────────────────────────────────────────────────
# Gmail SMTP configuration.
# Replace with your real Gmail address and App Password.
#
# HOW TO GET A GMAIL APP PASSWORD:
#   1. Enable 2-Step Verification on your Google account
#   2. Go to: https://myaccount.google.com/apppasswords
#   3. Create an App Password for "Mail"
#   4. Copy the 16-character password and set it below (or use the env var)
#
# NEVER commit real credentials to version control.
# Use environment variables in production:
#   export MAIL_USERNAME=yourshop@gmail.com
#   export MAIL_PASSWORD=abcd efgh ijkl mnop

# ─────────────────────────────────────────────────────────────────────────────
# EMAIL / SMTP — FILL IN YOUR CREDENTIALS BELOW
# ─────────────────────────────────────────────────────────────────────────────
# HOW TO GET A GMAIL APP PASSWORD (takes 2 minutes):
#   1. Enable 2-Step Verification: myaccount.google.com/security
#   2. Go to:  myaccount.google.com/apppasswords
#   3. Select App = "Mail" → Generate → copy the 16-character code
#   4. Paste into spring.mail.password below WITHOUT spaces
#
# REPLACE the values below and restart the backend:
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# REPLACE with your Gmail address:
# ↓↓↓  EDIT THIS LINE — replace with your real Gmail address  ↓↓↓
spring.mail.username=vijay.dev2125@gmail.com
# ↑↑↑  example: spring.mail.username=srivelvanaturals@gmail.com  ↑↑↑
# REPLACE with your 16-char Gmail App Password (no spaces):
# ↓↓↓  EDIT THIS LINE — 16-char Gmail App Password, NO spaces  ↓↓↓
spring.mail.password=erkzjjgkbienslsz
# ↑↑↑  Get it: myaccount.google.com/apppasswords → Mail → Generate  ↑↑↑
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8
# Enable JavaMail protocol debug — prints SMTP conversation to console.
# This shows EXACTLY what happens during the SMTP handshake.
# Set to false in production once email is confirmed working.
spring.mail.properties.mail.debug=true
# Route JavaMail session protocol logs through SLF4J so they appear in Spring Boot console
logging.level.org.springframework.mail=DEBUG
logging.level.com.sun.mail=DEBUG
spring.mail.test-connection=false
app.mail.from-name=Sri Velva Naturals
