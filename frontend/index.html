    <!--
      ╔══════════════════════════════════════════════════════════════╗
      ║  NO CSP META TAG HERE — THIS IS INTENTIONAL                 ║
      ╠══════════════════════════════════════════════════════════════╣
      ║                                                              ║
      ║  CSP is applied in exactly ONE place per environment:        ║
      ║                                                              ║
      ║  DEVELOPMENT  →  HTTP header via vite.config.js             ║
      ║                   server.headers['Content-Security-Policy']  ║
      ║                   (includes unsafe-eval for Vite HMR)        ║
      ║                                                              ║
      ║  PRODUCTION   →  HTTP header on your hosting platform:       ║
      ║                   • Netlify  →  public/_headers              ║
      ║                   • Vercel   →  vercel.json                  ║
      ║                   • Nginx    →  nginx.conf add_header        ║
      ║                   (NO unsafe-eval — secure)                  ║
      ║                                                              ║
      ║  WHY NOT A META TAG?                                         ║
      ║  When a browser receives CSP from BOTH an HTTP header AND a  ║
      ║  <meta> tag, it enforces BOTH policies simultaneously at     ║
      ║  their intersection — i.e. the most restrictive of the two.  ║
      ║  Even if the header allows 'unsafe-eval', the meta tag can   ║
      ║  block it. Chromium also has a whitespace-parsing quirk with ║
      ║  multiline content="" attributes that causes 'unsafe-eval'   ║
      ║  to be silently dropped.                                     ║
      ║                                                              ║
      ║  One policy, one place = no conflicts, no surprises.         ║
      ╚══════════════════════════════════════════════════════════════╝
    -->
